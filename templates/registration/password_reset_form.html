{% extends "base.html" %}
{% block content %}
  <form action="" method="post">
  {% csrf_token %} <!--per proteggere il sito da un attacco csrf-->
  {% if form.email.errors %} <!--Controlla se il campo email del form contiene errori di validazione-->
    {{ form.email.errors }} <!--errori del campo email-->
  {% endif %}
      <p>{{ form.email }}</p>
    <input type="submit" class="btn btn-default btn-lg" value="Reset password">
  </form>
{% endblock %}
